name: Format Check

on:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check C++ formatting
        run: |
          echo "Checking C++ formatting..."

          FILES=$(find . -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \))

          if [ -z "$FILES" ]; then
            echo "No C++ files found."
            exit 0
          fi

          FAILED=0

          for file in $FILES; do
            clang-format --dry-run --Werror "$file" || FAILED=1
          done

          if [ $FAILED -ne 0 ]; then
            echo "❌ Formatting issues found. Run clang-format on your code."
            exit 1
          fi

          echo "✅ All C++ files are properly formatted."