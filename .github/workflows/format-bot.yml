name: Format on Command

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  format:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/format')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.issue.pull_request.head.sha }}

      - name: Create PR status comment (start)
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: "🔧 `/format` started — running clang-format..."
            });

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Get changed files
        run: |
          git fetch origin pull/${{ github.event.issue.number }}/head:pr

          FILES=$(git diff --name-only pr...HEAD -- \
            . ':!External/*' \
            | grep -E '\.(cpp|hpp|h)$' || true)

          echo "$FILES" > changed_files.txt

      - name: Format files
        run: |
          if [ ! -s changed_files.txt ]; then
            echo "No files to format."
            exit 0
          fi

          while read file; do
            clang-format -i "$file"
          done < changed_files.txt

      - name: Commit fixes
        run: |
          git config user.name "clang-format bot"
          git config user.email "clang-format@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi

          git commit -m "Apply clang-format fixes"

          git push origin HEAD:${{ github.event.issue.pull_request.head.ref }}

      - name: Comment success
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: "✅ clang-format complete — fixes pushed to PR."
            });