name: Format on Command

on:
  issue_comment:
    types: [created]

jobs:
  format:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/format')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ github.event.issue.number }}/head
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Get changed files
        run: |
          git fetch origin main

          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -E '\.(cpp|hpp|h)$' \
            | grep -v 'External/' || true)

          echo "$FILES" > changed_files.txt

      - name: Format files
        run: |
          if [ ! -s changed_files.txt ]; then
            echo "No files to format."
            exit 0
          fi

          while read file; do
            clang-format -i "$file"
          done < changed_files.txt

      - name: Commit fixes
        run: |
          git config user.name "clang-format bot"
          git config user.email "clang-format@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi

          git commit -m "Apply clang-format fixes"
          git push